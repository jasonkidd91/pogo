name: Weekly collection refresh

# Regenerates the Mega and Dynamax lists (web/mega-data.js, web/max-data.js) and opens a PR
# if the roster or any card's data changed. Sunday 20:00 UTC == Monday 04:00 MYT, an hour
# after the daily maintenance run so the two never race on main.
#
# Deliberately NOT a Claude run and NOT a push to main:
# - The generators are deterministic and already refuse to write bad data (sprite check,
#   typing guard, "?" count guard — see scripts/bulbapedia.py and scripts/gamemaster.py).
#   If one raises, this job fails and nothing is written. No judgement is needed to run
#   them, so there is no reason to spend a Claude run on it.
# - A new roster entry and its rank are worth a human look before they ship, the same
#   reasoning that makes tracker builds open a PR.
#
# Rosters are SLOW data, which is why this runs weekly rather than daily.
on:
  schedule:
    - cron: '0 20 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: weekly-collections
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # PAT, not GITHUB_TOKEN, for the same reason as daily-maintenance.yml: anything a
      # GITHUB_TOKEN pushes or opens does not trigger other workflows.
      GH_TOKEN: ${{ secrets.POGO_GITHUB_PAT }}
      BRANCH: auto/collections-refresh
      FILES: web/mega-data.js web/max-data.js
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.POGO_GITHUB_PAT }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate Mega and Dynamax lists
        id: gen
        env:
          # Bulbapedia sits behind Cloudflare, which answers runner requests with a "Just a
          # moment..." challenge page instead of data (first seen 2026-11-12). Never try to
          # get past it; the block is deliberate. Instead scripts/bulbapedia.py falls back to
          # the committed copy in scripts/bulbapedia-cache/ (refreshed by every run that gets
          # through, local or here), so the Game Master half of each card (stats, typing,
          # rank) still refreshes weekly. The roster itself only moves when the cache does,
          # which is what the issue below asks a human to do.
          BULBAPEDIA_CACHE_FALLBACK: '1'
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/gen.log"
          for script in update_megas.py update_dynamax.py; do
            if ! python3 "scripts/$script" 2>&1 | tee -a "$RUNNER_TEMP/gen.log"; then
              # Blocked AND no cached copy to fall back to: nothing can be built.
              if grep -qE 'Just a moment|Bulbapedia did not return data' "$RUNNER_TEMP/gen.log"; then
                echo "blocked=true" >> "$GITHUB_OUTPUT"
                echo "generated=false" >> "$GITHUB_OUTPUT"
                echo "::warning::Bulbapedia blocked $script and it has no cached copy; skipping this week."
                git checkout -- $FILES
                exit 0
              fi
              exit 1
            fi
          done
          echo "generated=true" >> "$GITHUB_OUTPUT"
          if grep -q 'using cached copy' "$RUNNER_TEMP/gen.log"; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            oldest=$(grep -oE 'cached copy from [0-9-]+' "$RUNNER_TEMP/gen.log" | awk '{print $4}' | sort | head -1)
            echo "cache_date=$oldest" >> "$GITHUB_OUTPUT"
            echo "::warning::Bulbapedia was blocked; built from the cached roster (oldest page $oldest)."
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report a Bulbapedia block
        if: steps.gen.outputs.blocked == 'true'
        env:
          GENERATED: ${{ steps.gen.outputs.generated }}
          CACHE_DATE: ${{ steps.gen.outputs.cache_date }}
        run: |
          if [ "$GENERATED" = true ]; then
            note='The lists were rebuilt from the cached pages in `scripts/bulbapedia-cache/` (oldest fetched '"$CACHE_DATE"') with a current Game Master: stats and ranks are fresh, but a newly released Mega or Dynamax Pokémon will not appear until the cache is refreshed.'
          else
            note='There is no cached copy yet, so `web/mega-data.js` and `web/max-data.js` were not regenerated.'
          fi
          gh label create collections-blocked --color d93f0b \
            --description "Weekly Mega/Dynamax refresh could not reach Bulbapedia" --force
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh issue list --label collections-blocked --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still blocked on $(date -u +%Y-%m-%d): $run_url

          $note"
          else
            gh issue create --label collections-blocked \
              --title "Weekly Mega/Dynamax refresh blocked by Bulbapedia" \
              --body "$(cat <<EOF
          The weekly collection refresh could not reach Bulbapedia: its Cloudflare
          protection returned a "Just a moment..." challenge page instead of data.
          $note

          Run: $run_url

          **To refresh by hand**, from a normal connection:

          \`\`\`bash
          python3 scripts/update_megas.py
          python3 scripts/update_dynamax.py
          \`\`\`

          then commit the two data files **and \`scripts/bulbapedia-cache/\`** (that is what
          lets this job keep working while blocked). Do not try to work around the challenge; the
          block is deliberate. This issue closes itself on the next run that gets through.
          EOF
          )"
          fi

      - name: Close the block issue once Bulbapedia answers again
        if: steps.gen.outputs.blocked == 'false'
        run: |
          for n in $(gh issue list --label collections-blocked --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Bulbapedia answered again on $(date -u +%Y-%m-%d); the weekly refresh ran normally."
          done

      - name: Syntax-check generated files
        if: steps.gen.outputs.generated == 'true'
        run: |
          for f in $FILES; do node --check "$f"; done

      - name: Detect a real change
        if: steps.gen.outputs.generated == 'true'
        id: diff
        run: |
          # The header records the Game Master commit it was built from. That sha moves
          # almost every week. On its own it is not worth a PR, so ignore lines that only
          # carry it. Any change to a card, including a rank shifted by the new Game
          # Master, still counts.
          # The "built from scripts/bulbapedia-cache" stamp is ignored the same way.
          if git diff --quiet -I 'PokeMiners game_master' -I 'bulbapedia-cache' -- $FILES; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No roster or card changes (Game Master sha bumps ignored)."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- $FILES
          fi

      - name: Summarise the change
        if: steps.diff.outputs.changed == 'true'
        env:
          CACHE_DATE: ${{ steps.gen.outputs.cache_date }}
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/body.md"
          import json, re, subprocess

          def entries(text):
              # Each card is one JSON object on its own line, starting {"name": ...
              out = {}
              for line in text.splitlines():
                  line = line.strip().rstrip(",")
                  if line.startswith('{"name"'):
                      try:
                          d = json.loads(line)
                      except ValueError:
                          continue
                      out[d["name"]] = d
              return out

          import os
          print("Weekly regeneration of the Mega and Dynamax lists from Bulbapedia and the "
                "PokeMiners Game Master.\n")
          if os.environ.get("CACHE_DATE"):
              print(f"> **Bulbapedia was blocked this week.** The roster comes from "
                    f"`scripts/bulbapedia-cache/` (oldest page fetched {os.environ['CACHE_DATE']}); "
                    "only the Game Master side is current. See the `collections-blocked` issue.\n")
          for path, label in [("web/mega-data.js", "Mega"), ("web/max-data.js", "Dynamax")]:
              old = subprocess.run(["git", "show", f"HEAD:{path}"], capture_output=True,
                                   text=True).stdout
              new = open(path).read()
              a, b = entries(old), entries(new)
              added = sorted(set(b) - set(a))
              removed = sorted(set(a) - set(b))
              changed = sorted(n for n in set(a) & set(b) if a[n] != b[n])
              unknown = sorted(n for n, d in b.items() if d.get("rank") == "?")
              print(f"### {label} (`{path}`)\n")
              if not (added or removed or changed):
                  print("No card changes.\n")
              for title, names in [("Added", added), ("Removed", removed)]:
                  if names:
                      print(f"**{title}:** " + ", ".join(names) + "\n")
              if changed:
                  print("**Changed:**\n")
                  for n in changed:
                      keys = sorted(k for k in set(a[n]) | set(b[n]) if a[n].get(k) != b[n].get(k))
                      diffs = "; ".join(f"`{k}` {a[n].get(k)!r} → {b[n].get(k)!r}" for k in keys)
                      print(f"- {n}: {diffs}")
                  print()
              if unknown:
                  print("**Rank `?`** (Game Master has no entry yet; it fills in on a later "
                        "run): " + ", ".join(unknown) + "\n")

          print("### Before merging\n")
          print("- [ ] Check that any added Pokémon has actually been released (Bulbapedia "
                "is the source; the generator already drops HTML-commented, unreleased rows).")
          print("- [ ] Open `megas.html` / `dynamax.html` and look at the new cards "
                "(`verify-site` skill).\n")
          print("🤖 Generated with [Claude Code](https://claude.com/claude-code)")
          PY
          cat "$RUNNER_TEMP/body.md"

      - name: Open or update the PR
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "pogo-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B "$BRANCH"
          # The cache rides along so a run that got through keeps it fresh for blocked ones.
          git add $FILES scripts/bulbapedia-cache
          git commit -m "Refresh Mega and Dynamax lists"
          # One standing branch: a PR left unmerged for a week gets rebuilt from the current
          # main, rather than a second PR piling up next to it.
          git push --force origin "$BRANCH"
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file "$RUNNER_TEMP/body.md"
            echo "Updated PR #$existing"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "Refresh Mega and Dynamax lists" \
              --body-file "$RUNNER_TEMP/body.md"
          fi
