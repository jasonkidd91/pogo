name: Claude Code

# Comment-triggered assistant. Deliberately scoped to *comment* events only (issue_comment,
# pull_request_review_comment) — not `issues: [opened, ...]`. Issues that
# daily-maintenance.yml files for a candidate tracker quote the literal phrase "@claude
# implement it" as instructional text in the issue body; triggering on issue *creation* too
# would fire the instant that body lands, before any human has asked for anything.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 150
            --permission-mode bypassPermissions

          # bypassPermissions: headless Claude Code denies Bash/Edit/Write by default since
          # there's no human to click "allow" — confirmed empirically on this repo's other
          # workflow (14 silent permission denials, no-op run) before this flag was added.
          # Safe here because only repo write-access users can trigger this workflow at all
          # (default actor check, no allowed_non_write_users) and it authenticates with the
          # scoped, short-lived default GITHUB_TOKEN, not a long-lived PAT.
          #
          # 150, not 60: a real tracker build (verify a roster against 2+ live sources, write
          # 3 files, commit, push, open a PR) ran out of turns at 60 with the roster verified
          # and the page already written but nothing committed — standing up the verify-site
          # skill's Chromium sysroot from scratch ate the rest. The issue-body template this
          # responds to now tells it to skip that and leave full browser verification to the
          # PR review instead, but the headroom stays; a fresh runner has no cached sysroot.
          #
          # Everything else — "is this event over?", "use the new-event-tracker skill",
          # "reply and close if it's finished" — comes from the issue body that
          # daily-maintenance.yml wrote, plus CLAUDE.md, which is loaded automatically from
          # the checked-out repo. No custom prompt needed for the tracker-request flow.
          #
          # This workflow also answers any other "@claude ..." comment on an issue or PR —
          # that's the standard behaviour of this action and not specific to trackers.
